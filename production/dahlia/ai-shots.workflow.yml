name: Generate AI video shots
run-name: Black Dahlia · Agnes Video V2.0

on:
  workflow_dispatch:
    inputs:
      payload:
        description: 'JSON: {"only":"S01","workers":1}; empty only generates the full reviewed shot plan'
        type: string
        default: '{"only":"S01","workers":1}'

permissions:
  contents: write

concurrency:
  group: black-dahlia-arena-01a085be
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref == 'refs/heads/arena/01a085be-desktop-tutorial'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 100
    steps:
      - name: Check out this Arena production branch
        uses: actions/checkout@v4
        with:
          ref: arena/01a085be-desktop-tutorial
          fetch-depth: 1

      - name: Validate the complete three-minute timeline
        run: python3 production/dahlia/generate.py --validate

      - name: Generate Agnes clips and checkpoint provenance
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          PAYLOAD: ${{ inputs.payload }}
        run: python3 -u production/dahlia/generate.py --publish --payload "$PAYLOAD"

      - name: Save video clips as downloadable artifacts, not Git objects
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: black-dahlia-agnes-${{ github.run_number }}
          path: |
            work/dahlia/clips/
            production/dahlia/results.json
          if-no-files-found: warn
          compression-level: 0
          retention-days: 3
