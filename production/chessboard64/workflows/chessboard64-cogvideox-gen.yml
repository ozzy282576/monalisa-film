# 38 个动态镜头统一走智谱 CogVideoX-Flash 免费档。
# 引擎 production/chessboard64/generate_cogvideox.py，移植自已实测跑通的 jeong2000 流水线。
name: 六十四格：国际象棋盘杀手 · CogVideoX生成
run-name: 六十四格 · 智谱 CogVideoX-Flash 生成 · ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      payload:
        description: 'JSON: {"only":"S01"}；空则全量 38 镜'
        type: string
        default: ''
  push:
    branches:
      - arena/56672981-monalisa-film
    paths:
      - production/chessboard64/COGVIDEOX_GEN_REQUEST

permissions:
  contents: write

concurrency:
  group: chessboard64-cogvideox-arena-56672981-monalisa-film
  # 长生成不排队等：断点续跑靠 SHA-256 收据，取消不丢已完成的镜头。
  cancel-in-progress: true

jobs:
  generate:
    if: github.ref == 'refs/heads/arena/56672981-monalisa-film'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 350
    steps:
      - name: Check out this Arena production branch
        uses: actions/checkout@v4
        with:
          ref: arena/56672981-monalisa-film
          fetch-depth: 0  # 全量历史：checkpoint 推送被拒后 fetch+rebase 才能成功

      - name: Resolve generation payload
        env:
          PAYLOAD_INPUT: ${{ inputs.payload }}
        run: |
          set -euo pipefail
          if [ -n "${PAYLOAD_INPUT:-}" ]; then payload="$PAYLOAD_INPUT";
          elif [ -f production/chessboard64/COGVIDEOX_GEN_REQUEST ]; then payload="$(tr -d '\n' < production/chessboard64/COGVIDEOX_GEN_REQUEST)";
          else payload='{}'; fi
          echo "PAYLOAD=$payload" >> "$GITHUB_ENV"
          echo "Generation payload: $payload"

      - name: Ensure ffmpeg is available
        run: |
          # 生成阶段只用 ffmpeg/ffprobe 验片和出接触表，不排任何中文字幕，所以不装 CJK 字体。
          # 实测 2026-10-26：apt 装字体那步两次各卡 20 分钟以上，够生成十几镜了。
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            echo "ffmpeg already present on the runner image"
          else
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=60 \
              -o Acquire::https::Timeout=60 install -y -qq ffmpeg
          fi
          ffmpeg -hide_banner -version | head -1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CogVideoX and inspection dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "zhipuai>=2.1" "requests>=2.31" "sniffio>=1.3" "httpx>=0.27" "pillow>=10,<13" "numpy>=1.26,<3" "av>=12,<19"

      - name: Validate the complete three-minute timeline
        run: python3 production/chessboard64/generate_cogvideox.py --validate

      - name: Generate 38 CogVideoX-Flash clips and checkpoint receipts
        env:
          ZHIPUAI_API_KEY: ${{ secrets.ZHIPUAI_API_KEY }}
          PAYLOAD: ${{ env.PAYLOAD }}
        run: |
          set -o pipefail
          python3 -u production/chessboard64/generate_cogvideox.py --publish --payload "$PAYLOAD" 2>&1 | tee /tmp/gen.log
          exit ${PIPESTATUS[0]}

      - name: Ship failure log to branch (sandbox cannot read Actions logs)
        if: failure()
        run: |
          tail -c 200000 /tmp/gen.log > production/chessboard64/gen-diag-cogvideox.log || true
          git config user.name "arena-diag"
          git config user.email "arena@local"
          git add -f production/chessboard64/gen-diag-cogvideox.log
          git commit -m "chessboard64: CogVideoX 生成失败诊断 $(date -u +%FT%TZ)" || true
          git push origin HEAD:arena/56672981-monalisa-film || true

      - name: Save generation evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: chessboard64-cogvideox-${{ github.run_number }}
          path: |
            production/chessboard64/results.json
            production/chessboard64/qa/
            production/chessboard64/gen-diag-cogvideox.log
          if-no-files-found: warn
          retention-days: 14
