# 模板：production/new_topic.py 会把 __SLUG__ / __BRANCH__ / __SHORT_BRANCH__ / __TITLE__ / __FILM__ 换成新项目的值，
# 生成 production/<slug>/workflows/<slug>-*.yml；复制到 .github/workflows/ 后即可用 marker 文件 push 触发。
name: __TITLE__ · 出片
run-name: 出片 · __TITLE__ · ${{ github.ref_name }}

# 触发方式：在分支上写 production/__SLUG__/RENDER_REQUEST（内容随便，例如 "render 2026-09-21T10:00:00Z"）并 push。
# 成片、字幕、EDL、音频实测报告由 production/run_project.sh commit 回分支（交付/ 与 production/__SLUG__/delivery/）。

on:
  workflow_dispatch:
    inputs:
      skip_asr:
        description: '跳过 ASR 对轨（离线时用停顿估算字幕时间）'
        type: boolean
        default: false
      film_name:
        description: '成片文件名'
        required: false
        default: '__FILM__'
  push:
    branches:
      - __BRANCH__
    paths:
      - production/__SLUG__/RENDER_REQUEST

permissions:
  contents: write

concurrency:
  group: __SLUG__-render-arena-__SHORT_BRANCH__
  cancel-in-progress: false

jobs:
  render:
    if: github.ref == 'refs/heads/__BRANCH__'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 120
    steps:
      - name: Check out this Arena production branch
        uses: actions/checkout@v4
        with:
          ref: __BRANCH__
          fetch-depth: 1

      - name: Install media tools and CJK fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          ffmpeg -hide_banner -version | head -1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install render dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pillow>=10,<13" "numpy>=1.26,<3" "faster-whisper>=1.1,<2" "av>=12,<16" || \
          python -m pip install --break-system-packages "pillow>=10,<13" "numpy>=1.26,<3" "faster-whisper>=1.1,<2" "av>=12,<16"

      - name: Resolve the deliverable name
        env:
          FILM_INPUT: ${{ inputs.film_name }}
        run: |
          set -euo pipefail
          if [ -n "${FILM_INPUT:-}" ]; then
            film="$FILM_INPUT"
          else
            film='__FILM__'
          fi
          echo "FILM_NAME=$film" >> "$GITHUB_ENV"
          echo "Deliverable: $film"

      - name: Validate, restore footage, render with measured audio, publish reports
        env:
          PROJECT: __SLUG__
          SKIP_ASR: ${{ inputs.skip_asr || 'false' }}
          FILM_NAME: ${{ env.FILM_NAME }}
          BRANCH: __BRANCH__
        run: bash production/run_project.sh "$PROJECT" "$SKIP_ASR" "$FILM_NAME" 2>&1 | tee /tmp/rend.log production/__SLUG__/last-render.log; exit ${PIPESTATUS[0]}

      - name: Ship failure log to branch (sandbox cannot read Actions logs)
        if: failure()
        run: |
          tail -c 200000 /tmp/rend.log > production/__SLUG__/render-diag.log
          git config user.name "arena-diag"
          git config user.email "arena@local"
          git add -f production/__SLUG__/render-diag.log
          git commit -m "__SLUG__: 出片失败诊断 $(date -u +%FT%TZ)"
          pushed=0
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${{ github.ref_name }}"; then pushed=1; break; fi
            git fetch origin ${{ github.ref_name }} && git rebase FETCH_HEAD || break
          done
          [ "$pushed" = "1" ] || echo "::error::诊断日志推不回分支，看本次运行的 artifact"

      - name: Upload the finished film
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: __SLUG__-成片-${{ github.run_number }}
          path: work/__SLUG__/*.mp4
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30
