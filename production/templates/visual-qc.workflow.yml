# 模板：production/new_topic.py 会把 __SLUG__ / __BRANCH__ / __SHORT_BRANCH__ / __TITLE__ / __FILM__ 换成新项目的值，
# 生成 production/<slug>/workflows/<slug>-visual-qc.yml；复制到 .github/workflows/ 后即可用 marker 文件 push 触发。
#
# 这一步解码成片的**每一帧**（参考实现的片子是 5400/5400），查黑帧 / 冻结 / 时序突变 /
# 人脸 / 手部几何，并把审片证据（全帧接触表、手部表、原始分辨率候选帧）写回仓库。
# 自动结果只是分诊：片尾卡/信息卡有没有字被画面裁掉这类缺陷，逐帧差异与检测器都量不到
# （参考实现那部的片尾卡就是这样被裁了两端、而三道自动闸门全绿）。签收必须是人做的。
name: __TITLE__ · 成片全帧视觉QC
run-name: 成片全帧视觉QC · __TITLE__ · ${{ github.ref_name }}

# 触发方式：在当前制作分支写/改 production/__SLUG__/VISUAL_QC_REQUEST 后 push。
# 此任务只检查已经交付的 MP4；不会重新生成素材，也不会把自动结果伪装成人工签收。

on:
  workflow_dispatch:
  push:
    branches:
      - __BRANCH__
    paths:
      - production/__SLUG__/VISUAL_QC_REQUEST

permissions:
  contents: write

concurrency:
  group: __SLUG__-visual-qc-arena-__SHORT_BRANCH__
  cancel-in-progress: false

jobs:
  audit:
    if: github.ref == 'refs/heads/__BRANCH__'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 120
    steps:
      - name: Check out this Arena production branch
        uses: actions/checkout@v4
        with:
          ref: __BRANCH__
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deterministic full-frame QC runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==1.26.4" "pillow>=10,<13" "av>=12,<16" \
            "opencv-python-headless==4.10.0.84" "matplotlib>=3.8,<4" \
            "absl-py>=2,<3" "attrs>=19.1" "flatbuffers>=2" "protobuf>=4.25.3,<5"
          python -m pip install --no-deps "mediapipe==0.10.21"
          python - <<'PY'
          import av, cv2, mediapipe as mp, numpy as np
          assert cv2.__version__ == '4.10.0'
          assert mp.__version__ == '0.10.21'
          print('frame-QC runtime ready', av.__version__, cv2.__version__, mp.__version__, np.__version__)
          PY

      - name: Verify the delivered file against the render receipt
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          film = Path('交付/__FILM__')
          report = json.loads(Path('production/__SLUG__/delivery/technical-report.json').read_text())
          got = hashlib.sha256(film.read_bytes()).hexdigest()
          assert got == report['sha256'], f'delivered-file SHA mismatch: {got} != {report["sha256"]}'
          print('verified delivered SHA-256', got)
          PY

      - name: Decode and scan every output frame
        run: |
          set -euo pipefail
          film='交付/__FILM__'
          python3 production/__SLUG__/audit_frame_distortions.py \
            --film "$film" --project production/__SLUG__ \
            --out production/__SLUG__/delivery/frame-distortion-audit.json \
            --work work/__SLUG__/final-frame-audit
          python3 production/__SLUG__/compose_all_frame_sheets.py \
            --film "$film" --project production/__SLUG__ \
            --out work/__SLUG__/final-frame-audit/all-frames
          python3 production/__SLUG__/export_visual_review_candidates.py \
            --film "$film" \
            --audit production/__SLUG__/delivery/frame-distortion-audit.json \
            --out work/__SLUG__/final-frame-audit/review-candidates

      - name: Publish compact final-cut review evidence into the repository
        run: |
          set -euo pipefail
          film='交付/__FILM__'
          python3 production/__SLUG__/publish_visual_review_bundle.py \
            --film "$film" \
            --audit production/__SLUG__/delivery/frame-distortion-audit.json \
            --all-frames work/__SLUG__/final-frame-audit/all-frames \
            --contacts work/__SLUG__/final-frame-audit/contacts \
            --candidates work/__SLUG__/final-frame-audit/review-candidates \
            --out production/__SLUG__/qa/final-frame-review

      - name: Record automation evidence without claiming human approval
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          film = Path('交付/__FILM__')
          audit = json.loads(Path('production/__SLUG__/delivery/frame-distortion-audit.json').read_text())
          checks = audit['checks']
          midpoint = Path('work/__SLUG__/final-frame-audit/contacts/shot-midpoints.jpg')
          assert midpoint.is_file(), 'missing visual midpoint contact sheet'
          published_midpoint = Path('production/__SLUG__/delivery/visual-qc-shot-midpoints.jpg')
          published_midpoint.write_bytes(midpoint.read_bytes())
          summary = {
              'film': film.name,
              'sha256': hashlib.sha256(film.read_bytes()).hexdigest(),
              'workflow_run': os.environ['GITHUB_SERVER_URL'] + '/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID'],
              'all_decoded_frames_scanned': audit['video']['all_decoded_frames_scanned'],
              'decoded_frames': audit['video']['decoded_frames'],
              'expected_frames': audit['video']['expected_frames'],
              'automated_status': audit['status'],
              'unplanned_black_frames': checks['unplanned_black_frame_count'],
              'non_graphic_freeze_runs': len(checks['non_graphic_freeze_runs']),
              'temporal_outlier_windows': len(checks['temporal_outlier_windows']),
              'face_review_candidates': len(checks['face_review_candidates']),
              'hand_landmark_extreme_events': len(checks['hand_landmark_extreme_events']),
              'human_semantic_visual_review': 'pending',
              'midpoint_contact_sheet': str(published_midpoint),
              'note': 'Automation is triage. Review the uploaded all-frame, midpoint, hand, and suspect-frame artifacts before final sign-off.'
          }
          Path('production/__SLUG__/delivery/visual-qc-summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2) + '\n')
          print(json.dumps(summary, ensure_ascii=False))
          PY

      - name: Commit compact audit receipts back to the production branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add production/__SLUG__/delivery/frame-distortion-audit.json \
            production/__SLUG__/delivery/frame-distortion-audit.md \
            production/__SLUG__/delivery/visual-qc-summary.json \
            production/__SLUG__/delivery/visual-qc-shot-midpoints.jpg \
            production/__SLUG__/qa/final-frame-review
          if ! git diff --cached --quiet; then
            git commit -m '__SLUG__: audit every frame of delivered cut'
            pushed=0
            for attempt in 1 2 3 4 5; do
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then pushed=1; break; fi
              git fetch origin "${GITHUB_REF_NAME}" && git rebase FETCH_HEAD || break
              sleep 5
            done
            test "$pushed" = 1
          fi

      - name: Upload full visual-review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: __SLUG__-final-frame-qc-${{ github.run_number }}
          path: |
            work/__SLUG__/final-frame-audit/
            production/__SLUG__/delivery/frame-distortion-audit.*
            production/__SLUG__/delivery/visual-qc-summary.json
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30
