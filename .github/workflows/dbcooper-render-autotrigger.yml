name: DB库珀 · 出片（push 触发）

on:
  push:
    branches:
      - arena/01a08e48-desktop-tutorial
    paths:
      - production/dbcooper/story.json
      - production/dbcooper/results.json
      - production/dbcooper/render.py
      - production/dbcooper/audio/**
  workflow_dispatch:
    inputs:
      film_name:
        description: '成片文件名（默认 DB库珀劫机案_三分钟_带声音.mp4）'
        required: false
        default: 'DB库珀劫机案_三分钟_带声音.mp4'

permissions:
  contents: write

concurrency:
  group: dbcooper-render-arena-01a08e48-desktop-tutorial
  cancel-in-progress: false

jobs:
  render:
    if: github.ref == 'refs/heads/arena/01a08e48-desktop-tutorial'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a08e48-desktop-tutorial
          fetch-depth: 1

      - name: Install media tools and CJK fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          ffmpeg -hide_banner -version | head -1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install render dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pillow>=10,<13" "numpy>=1.26,<3" "faster-whisper>=1.1,<2" || \
          python -m pip install --break-system-packages "pillow>=10,<13" "numpy>=1.26,<3" "faster-whisper>=1.1,<2"

      - name: Validate, restore footage, render with measured audio, publish reports
        env:
          PROJECT: dbcooper
          SKIP_ASR: "false"
          FILM_NAME: ${{ inputs.film_name || 'DB库珀劫机案_三分钟_带声音.mp4' }}
          BRANCH: arena/01a08e48-desktop-tutorial
        run: bash production/run_project.sh "$PROJECT" "$SKIP_ASR" "$FILM_NAME"

      - name: Upload the finished film
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbcooper-成片-${{ github.run_number }}
          path: work/dbcooper/*.mp4
          if-no-files-found: warn
          compression-level: 0
          retention-days: 1
