name: Generate Mona Lisa film (Agnes) - Lam Norway style 15 clips x 200
on:
  push:
    branches: [arena/7d72cae2-monalisa-film]
    paths: [RUN_AGNES]
  workflow_dispatch:
    inputs:
      scene:
        description: '指定片段 01-15'
        required: false
        default: ''

permissions:
  contents: read
  actions: write

env:
  AGNES_MAX_TRIES: '200'

concurrency:
  group: agnes-film-lam
  cancel-in-progress: false

jobs:
  clip_01_window_1:
    name: Clip 01 - checkpoint window 1 of 4 - total cap 200 - Norway style
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/7d72cae2-monalisa-film
      - name: Install deps
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg && pip install pillow
      - name: Continue clip 01 within cumulative 200-attempt limit
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
        run: python3 -u scripts/generate.py --scene 01 --create-window 50
      - name: Save cumulative media and request budget
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-01-window-1
          path: |
            clips/
            work/
          retention-days: 30
          if-no-files-found: error

  clip_01_window_2:
    name: Clip 01 - checkpoint window 2 of 4 - total cap 200 - Norway style
    needs: clip_01_window_1
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/7d72cae2-monalisa-film
      - name: Restore prior serial checkpoint
        uses: actions/download-artifact@v4
        with:
          name: checkpoint-01-window-1
          path: .
      - name: Require saved state - never reset attempts
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import shutil
          p=Path('work/state.json')
          if not p.exists() and Path('state.json').exists():
              p.parent.mkdir(exist_ok=True)
              shutil.move('state.json', p)
          if not p.exists():
              raise SystemExit('Checkpoint missing; no request sent')
          PYCODE
      - name: Install deps
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg && pip install pillow
      - name: Continue clip 01 within cumulative 200-attempt limit
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
        run: python3 -u scripts/generate.py --scene 01 --create-window 50
      - name: Save cumulative media and request budget
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-01-window-2
          path: |
            clips/
            work/
          retention-days: 30
          if-no-files-found: error

