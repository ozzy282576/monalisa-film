name: Norway film - remaining scenes up to 200 attempts
on:
  push:
    branches: [arena/01a0f777-monalisa-film]
    paths: [RUN_AGNES]
permissions:
  contents: read
  actions: read
env:
  AGNES_MAX_TRIES: '200'
concurrency:
  group: agnes-film
  cancel-in-progress: false
jobs:
  clip_11_window_1:
    name: Clip 11 - checkpoint window 1 of 4 - total cap 200
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Restore prior serial checkpoint
        uses: actions/download-artifact@v4
        with:
          name: raw-clips
          path: .
          run-id: '36999794025'
          github-token: ${{ github.token }}
      - name: Require saved state - never reset attempts
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import shutil
          p=Path('work/state.json')
          if not p.exists() and Path('state.json').exists():
              p.parent.mkdir(exist_ok=True)
              shutil.move('state.json', p)
          if not p.exists():
              raise SystemExit('Checkpoint missing; no request sent')
          PYCODE
      - name: Continue clip 11 within cumulative 200-attempt limit
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
        run: python3 -u scripts/generate.py --scene 11 --create-window 50
      - name: Save cumulative media and request budget
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-11-window-1
          path: |
            clips/
            work/
          retention-days: 30
          if-no-files-found: error
