    name: Review only if all 15 raw clips exist
    needs: clip_15
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: checkpoint-15
          path: .
      - name: Check collection completeness
        id: gate
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import os
          missing=[f'{i:02}' for i in range(1,16) if not Path(f'clips/{i:02}.mp4').exists()]
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('complete='+str(not missing).lower()+'\n')
          if missing:
              print(f'::warning title=Incomplete collection::Missing {missing}; no QC, no finished film. Attempts completed is not video completion.')
          PYCODE
      - name: Install ffmpeg
        if: steps.gate.outputs.complete == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Batch QC and selective repair
        if: steps.gate.outputs.complete == 'true'
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
        run: python3 -u scripts/generate.py --review
      - name: Preserve aggregate results
