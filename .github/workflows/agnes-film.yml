name: Norway film - serial Agnes generation
on:
  push:
    branches: [arena/01a0f777-monalisa-film]
    paths: [RUN_AGNES]
  workflow_dispatch:
    inputs:
      resume_run:
        description: Prior run ID whose raw-clips artifact should be restored (optional)
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: agnes-film
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0f777-monalisa-film
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Restore explicitly selected prior run
        uses: actions/download-artifact@v4
        with:
          name: raw-clips
          path: .
          run-id: ${{ inputs.resume_run || '36865885084' }}
          github-token: ${{ github.token }}
      - name: Locate restored state and summarize prior failure
        run: |
          python3 - <<'PYCODE'
          import json, pathlib, shutil
          p=pathlib.Path('work/state.json')
          if not p.exists() and pathlib.Path('state.json').exists():
              p.parent.mkdir(exist_ok=True)
              shutil.move('state.json', p)
          if not p.exists():
              raise SystemExit('Restored state missing; refusing an untracked restart')
          for sid, st in json.loads(p.read_text()).items():
              print(sid, 'status=',st.get('status'), 'tries=',st.get('tries'), 'HTTP=',st.get('http_code'))
          PYCODE
      - name: Collect raw clip 01 - no QC yet
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
        run: python3 -u scripts/generate.py --scene 01 --renew-exhausted
      - name: Publish raw clip 01 and progress
        uses: actions/upload-artifact@v4
        with:
          name: raw-clip-01
          path: |
            clips/01.mp4
            work/state.json
          retention-days: 30
      - name: Collect raw clip 02 - no QC yet
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
        run: python3 -u scripts/generate.py --scene 02
      - name: Publish raw clip 02 and progress
