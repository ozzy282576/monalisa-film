name: Norway film - serial per-scene attempts
on:
  push:
    branches: [arena/01a0f777-monalisa-film]
    paths: [RUN_AGNES]
permissions:
  contents: read
  actions: read
concurrency:
  group: agnes-film
  cancel-in-progress: false
jobs:
  clip_01:
    name: Clip 01 - up to 50 attempts
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Restore prior serial checkpoint
        uses: actions/download-artifact@v4
        with:
          name: raw-clips
          path: .
          run-id: '36876593240'
          github-token: ${{ github.token }}
      - name: Ensure state is present
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import shutil
          p=Path('work/state.json')
          if not p.exists() and Path('state.json').exists():
              p.parent.mkdir(exist_ok=True)
              shutil.move('state.json', p)
          if not p.exists():
              raise SystemExit('Checkpoint missing; refusing to reset request budgets')
          PYCODE
      - name: Collect 01; exhausted quota continues to next job
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
        run: python3 -u scripts/generate.py --scene 01
      - name: Preserve media and state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-01
          path: |
            clips/
            work/
          retention-days: 30
          if-no-files-found: error
