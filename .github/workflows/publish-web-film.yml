name: Publish web-sized film to repo (no-auth download)
on:
  push:
    branches: [arena/01a10095-monalisa-film]
    paths: [RUN_WEB]
permissions:
  contents: write
  actions: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          name: final-film-180
          run-id: '37165138605'
          github-token: ${{ github.token }}
          path: out/
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Re-encode web version (<100MB)
        run: |
          mkdir -p deliver
          ffmpeg -y -v error -i out/monalisa_180_final.mp4 \
            -c:v libx264 -b:v 3000k -maxrate 3500k -bufsize 7000k -preset medium \
            -c:a aac -b:a 128k -movflags +faststart deliver/monalisa_180_web.mp4
          ls -la deliver/
      - name: Commit web film for no-auth raw download
        run: |
          git config user.name 'arena-ai-coding-agent[bot]'
          git config user.email '298482267+arena-ai-coding-agent[bot]@users.noreply.github.com'
          git add deliver/monalisa_180_web.mp4
          git commit -m 'Add web-sized 180s film for direct download'
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
