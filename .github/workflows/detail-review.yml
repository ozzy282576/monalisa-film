name: Inspect retained clips - read-only media analysis
on:
  push:
    branches: [arena/01a0f777-monalisa-film]
    paths: [RUN_DETAIL_REVIEW]
permissions:
  contents: write
  actions: read
concurrency:
  group: visual-evidence-only
  cancel-in-progress: false
jobs:
  details:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: raw-clips
          run-id: '37011035670'
          github-token: ${{ github.token }}
          path: .
      - name: Install inspection tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg fonts-dejavu-core
          python3 -m pip install pillow
      - name: Extract native-frame detail sequences
        run: python3 scripts/prepare_detail_review.py
      - uses: actions/upload-artifact@v4
        with:
          name: native-detail-frames
          path: |
            work/detail-frames/
            review/details-v1/
          retention-days: 30
      - name: Publish small evidence sheets
        run: |
          git config user.name 'arena-ai-coding-agent[bot]'
          git config user.email '298482267+arena-ai-coding-agent[bot]@users.noreply.github.com'
          git add review/details-v1
          git diff --cached --quiet && exit 0
          git commit -m 'Add consecutive-frame detail evidence for retained scenes'
          git pull --rebase origin arena/01a0f777-monalisa-film
          git push origin HEAD:arena/01a0f777-monalisa-film
