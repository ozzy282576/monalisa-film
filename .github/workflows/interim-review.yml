name: Inspect first five visual replacements - no generation
on:
  push:
    branches: [arena/01a0f777-monalisa-film]
    paths: [RUN_INTERIM_REVIEW]
permissions:
  contents: write
  actions: read
concurrency:
  group: visual-evidence-only
  cancel-in-progress: false
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0f777-monalisa-film
      - uses: actions/download-artifact@v4
        with:
          name: visual-12-4
          run-id: '37078250154'
          github-token: ${{ github.token }}
          path: .
      - name: Install frame review tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg fonts-dejavu-core
          python3 -m pip install pillow
      - name: Extract replacement evidence
        env:
          REVIEW_IDS: '01,07,10,11,12'
          REVIEW_OUTPUT: review/repair-interim
        run: python3 scripts/prepare_visual_review.py
      - name: Preserve dense full-resolution frames
        uses: actions/upload-artifact@v4
        with:
          name: interim-replacement-frames
          path: |
            work/dense-frames/
            review/repair-interim/
          retention-days: 30
      - name: Publish small review sheets to the working branch
        run: |
          git config user.name 'arena-ai-coding-agent[bot]'
          git config user.email '298482267+arena-ai-coding-agent[bot]@users.noreply.github.com'
          git add review/repair-interim
          git diff --cached --quiet && exit 0
          git commit -m 'Add visual QC evidence sheets and original media metadata'
          git pull --rebase origin arena/01a0f777-monalisa-film
          git push origin HEAD:arena/01a0f777-monalisa-film
