# 模板：production/new_topic.py 会把 chessboard64 / arena/56672981-monalisa-film / 56672981-monalisa-film / 六十四格：国际象棋盘杀手 / 六十四格_国际象棋盘杀手_三分钟_带声音.mp4 换成新项目的值，
# 生成 production/<slug>/workflows/<slug>-*.yml；复制到 .github/workflows/ 后即可用 marker 文件 push 触发。
name: 六十四格：国际象棋盘杀手 · 出片
run-name: 出片 · 六十四格：国际象棋盘杀手 · ${{ github.ref_name }}

# 触发方式：在分支上写 production/chessboard64/RENDER_REQUEST（内容随便，例如 "render 2026-09-21T10:00:00Z"）并 push。
# 成片、字幕、EDL、音频实测报告由 production/run_project.sh commit 回分支（交付/ 与 production/chessboard64/delivery/）。

on:
  workflow_dispatch:
    inputs:
      skip_asr:
        description: '跳过 ASR 对轨（离线时用停顿估算字幕时间）'
        type: boolean
        default: false
      film_name:
        description: '成片文件名'
        required: false
        default: '六十四格_国际象棋盘杀手_三分钟_带声音.mp4'
  push:
    branches:
      - arena/56672981-monalisa-film
    paths:
      - production/chessboard64/RENDER_REQUEST

permissions:
  contents: write

concurrency:
  group: chessboard64-render-arena-56672981-monalisa-film-retry
  # A newer marker is an explicit replacement request; free the render slot from a stuck older run.
  cancel-in-progress: true

jobs:
  render:
    if: github.ref == 'refs/heads/arena/56672981-monalisa-film'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 120
    steps:
      - name: Check out this Arena production branch
        uses: actions/checkout@v4
        with:
          ref: arena/56672981-monalisa-film
          fetch-depth: 0  # 全量历史：checkpoint 推送被拒后 fetch+rebase 才能成功（浅克隆会让重试路径失败）

      - name: Ensure media tools and CJK fonts are available
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v fc-list >/dev/null 2>&1 \
             || ! fc-list : family | grep -qi 'Noto Sans CJK'; then
            # Hosted Ubuntu images ship cached apt indexes; avoid a full apt-get update here,
            # which can stall for tens of minutes on the runner's package mirror.
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=60 \
              -o Acquire::https::Timeout=60 install -y -qq ffmpeg fontconfig fonts-noto-cjk
          fi
          ffmpeg -hide_banner -version | head -1
          fc-list : family | grep -i 'Noto Sans CJK' | head -1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install render dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pillow>=10,<13" "numpy>=1.26,<3" "faster-whisper>=1.1,<2" "av>=12,<16" "edge-tts>=7,<8" || \
          python -m pip install --break-system-packages "pillow>=10,<13" "numpy>=1.26,<3" "faster-whisper>=1.1,<2" "av>=12,<16" "edge-tts>=7,<8"

      - name: Resolve the deliverable name
        env:
          FILM_INPUT: ${{ inputs.film_name }}
        run: |
          set -euo pipefail
          if [ -n "${FILM_INPUT:-}" ]; then
            film="$FILM_INPUT"
          else
            film='六十四格_国际象棋盘杀手_三分钟_带声音.mp4'
          fi
          echo "FILM_NAME=$film" >> "$GITHUB_ENV"
          echo "Deliverable: $film"

      - name: Validate, restore media on demand, render and publish text-only receipts
        env:
          SKIP_ASR: ${{ inputs.skip_asr || 'false' }}
          FORCE_EDGE_TTS: 'true'
          EDGE_TTS_VOICE: 'zh-CN-YunjianNeural'
          EDGE_TTS_PITCH: '-8Hz'
          FILM_NAME: ${{ env.FILM_NAME }}
          BRANCH: arena/56672981-monalisa-film
          GH_TOKEN: ${{ github.token }}
        run: bash production/chessboard64/run_project.sh "$SKIP_ASR" "$FILM_NAME" 2>&1 | tee /tmp/rend.log; exit ${PIPESTATUS[0]}

      - name: Ship failure log to branch (sandbox cannot read Actions logs)
        if: failure()
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('/tmp/rend.log').read_bytes()[-200000:].decode('utf-8', errors='replace')
          text = re.sub(r'(https?://[^\s?]+)\?[^\s]+', r'\1?[SIGNED_QUERY_REDACTED]', text)
          text = re.sub(r'(?i)TOKEN_[A-Za-z0-9_-]+', 'TOKEN_[REDACTED]', text)
          Path('production/chessboard64/render-diag.log').write_text(text, encoding='utf-8')
          PY
          git config user.name "arena-diag"
          git config user.email "arena@local"
          git add -f production/chessboard64/render-diag.log
          git commit -m "chessboard64: 出片失败诊断 $(date -u +%FT%TZ)"
          pushed=0
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${{ github.ref_name }}"; then pushed=1; break; fi
            git fetch origin ${{ github.ref_name }} && git rebase FETCH_HEAD || break
          done
          [ "$pushed" = "1" ] || echo "::error::诊断日志推不回分支，看本次运行的 artifact"

      - name: Upload finished film and review files (never Git media)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: chessboard64-film-${{ github.run_id }}
          path: |
            work/chessboard64/*.mp4
            work/chessboard64/render/*.json
            work/chessboard64/render/*.srt
            work/chessboard64/render/*.jpg
            production/chessboard64/delivery/render-manifest.json
            production/chessboard64/delivery/narration-manifest.json
            production/chessboard64/audio/*.mp3
            production/chessboard64/audio/manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
