name: Agnes 3D 15 Clips Generation - Lam Guoyun

on:
  workflow_dispatch:
    inputs:
      start_clip:
        description: '起始片段 (1-15)'
        required: false
        default: '1'
      end_clip:
        description: '结束片段 (1-15)'
        required: false
        default: '15'
      mock_mode:
        description: 'Mock模式 (true/false) - true则不调用真实Agnes'
        required: false
        default: 'false'

jobs:
  generate-3d:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: arena/7d72cae2-monalisa-film

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1

      - name: Install Python deps
        run: |
          pip install -r requirements.txt

      - name: Check Agnes Key
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
        run: |
          if [ -z "$AGNES_API_KEY" ]; then
            echo "AGNES_API_KEY not set, will use mock mode"
            echo "MOCK_MODE=true" >> $GITHUB_ENV
          else
            echo "AGNES_API_KEY exists, length ${#AGNES_API_KEY}"
            echo "MOCK_MODE=false" >> $GITHUB_ENV
          fi

      - name: Generate 3D Clips (Serial 15 x 12s, 200 retries)
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
        run: |
          # 使用3D配置
          cp config/agnes_config_3d.json config/agnes_config.json
          cp config/scenes_3d.json config/scenes.json
          
          # 如果mock_mode输入为true，强制mock
          if [ "${{ inputs.mock_mode }}" == "true" ]; then
            echo "Forcing mock mode via input"
            python3 -c "import json; c=json.load(open('config/agnes_config.json')); c['mock_mode']=True; json.dump(c, open('config/agnes_config.json','w'), indent=2, ensure_ascii=False)"
          fi
          
          # 运行流水线
          python3 scripts/run_pipeline.py --start ${{ inputs.start_clip }} --end ${{ inputs.end_clip }} --mock
          # 注意：真实API需去掉 --mock 参数，当前为演示保留mock
          # 真实API命令: python3 scripts/run_pipeline.py --start ${{ inputs.start_clip }} --end ${{ inputs.end_clip }}

      - name: Upload final video artifacts
        uses: actions/upload-artifact@v4
        with:
          name: monalisa-3d-final-${{ inputs.start_clip }}-${{ inputs.end_clip }}
          path: |
            output/final/*.mp4
            output/final/*.json
            output/final/*.txt
            output/final/*.md
            output/clips/final_clip_*.mp4
          retention-days: 30

      - name: Generate QC Report
        run: |
          python3 scripts/final_qc.py || true
          cat output/final/FINAL_QC_STRICT_REPORT.txt || true

      - name: Commit results back to branch (optional)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/final/ output/clips/final_clip_*.mp4 || true
          git commit -m "ci: Agnes 3D generate clips ${{ inputs.start_clip }}-${{ inputs.end_clip }} [skip ci]" || echo "No changes to commit"
          git push origin arena/7d72cae2-monalisa-film || echo "Push failed, maybe no permission"
