name: Finalize 180s film - Lam Norway style vertical 9:16
on:
  push:
    branches: [arena/7d72cae2-monalisa-film]
    paths: [RUN_FINALIZE]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: finalize-lam
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/7d72cae2-monalisa-film
      - name: Download raw clips - Lam Norway
        uses: actions/download-artifact@v4
        with:
          name: raw-clips-lam-norway
          path: .
      - name: Install ffmpeg, fonts, pillow
        run: |
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-cjk
          python3 -m pip install pillow
      - name: Finalize 180s film vertical 9:16
        run: |
          set +e
          python3 scripts/finalize_film.py 2>&1 | tee finalize.log
          rc=${PIPESTATUS[0]}
          cat finalize.log
          exit $rc
      - name: QC final film - distortion check
        if: success()
        run: |
          python3 scripts/final_qc.py || true
      - name: Upload final film
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: final-film-180-lam
          path: out/
          retention-days: 30
      - name: Publish web version
        if: success()
        run: |
          mkdir -p deliver
          ffmpeg -y -v error -i out/monalisa_180_final.mp4 -c:v libx264 -b:v 4000k -maxrate 4500k -bufsize 9000k -preset medium -c:a aac -b:a 128k -movflags +faststart deliver/monalisa_lam_180_vertical_web.mp4
          ls -lh deliver/
      - name: Commit contact sheet
        if: success()
        run: |
          ffmpeg -y -v error -i out/monalisa_180_final.mp4 -vf "select='not(mod(n,288))',scale=216:384,tile=5x3" -frames:v 1 docs/final-contact-sheet-lam.png || true
          git config user.name 'arena-ai-coding-agent[bot]'
          git config user.email '298482267+arena-ai-coding-agent[bot]@users.noreply.github.com'
          git add docs/final-contact-sheet-lam.png out/monalisa_180_final.mp4 deliver/monalisa_lam_180_vertical_web.mp4 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m 'Add final 180s Lam vertical contact sheet and film'
          git pull --rebase origin arena/7d72cae2-monalisa-film
          git push origin HEAD:arena/7d72cae2-monalisa-film
