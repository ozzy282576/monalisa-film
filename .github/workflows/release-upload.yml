name: 成片 · Release 资产上传（通用，marker 驱动）
run-name: 上传 Release 资产 · ${{ github.ref_name }}

# 沙箱出口封了 uploads.github.com / release-assets.githubusercontent.com，
# 代理（Agent）在沙箱里**传不了** release 资产。本管道由 runner 代传：
#
#   1) 代理先建 release 壳（github.com API 沙箱可达）：
#      gh release create <tag> --target <分支> --title ... --notes "规格+SHA-256"
#   2) 代理在分支上写/改 marker 文件 production/<slug>/RELEASE_UPLOAD_REQUEST：
#          tag=<release 标签>
#          src=<分支内成片路径，可含中文>
#          asset=<资产文件名，必须 ASCII，建议 片名-时长-分辨率.mp4>
#      push 即触发本管道；runner 从同一 commit 检出文件（git 对象校验保证
#      字节一致）→ cp 成 ASCII 名 → gh release upload --clobber。
#   3) 给用户两个链接：
#      https://github.com/<owner>/<repo>/releases/tag/<tag>
#      https://github.com/<owner>/<repo>/releases/download/<tag>/<asset>
#
# 踩坑备忘（2026-09-15 实测，详见 新题目开工手册.md 第 9 步）：
#   - 只放非 main 分支的工作流无法 workflow_dispatch（404，workflow 从默认分支发现）
#     → 所以用 marker 文件 push 触发（本仓库 VERBATIM_REQUEST 同款惯例）。
#   - runner locale 会损坏中文资产名（披萨… → ._….mp4）→ 必须 cp /tmp/<ascii> 再传。
#   - `gh release upload` 没有 --name 标志（unknown flag 直接红）。
#   - 私有仓库未登录访问 404 是正常现象；登录后即可下载。
#   - 上传后 CDN 传播约 1–3 分钟，刚传完 404 属正常，稍候再验。

on:
  push:
    paths:
      - 'production/**/RELEASE_UPLOAD_REQUEST'

permissions:
  contents: write

concurrency:
  group: release-upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: 解析本次 push 里的 marker 文件
        id: marker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 只认本次 commit 动过的 marker，避免误传旧 marker
          MARKER=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" \
            --jq '.files[] | select(.filename | endswith("RELEASE_UPLOAD_REQUEST")) | .filename' | head -1)
          [ -n "$MARKER" ] || { echo "::error::本次 push 未包含 RELEASE_UPLOAD_REQUEST"; exit 1; }
          echo "marker=$MARKER" >> "$GITHUB_OUTPUT"
          echo "本次 marker: $MARKER"
      - name: 读 marker 并校验
        id: m
        run: |
          TAG=$(grep -E '^tag='  "${{ steps.marker.outputs.marker }}" | cut -d= -f2-)
          SRC=$(grep -E '^src='  "${{ steps.marker.outputs.marker }}" | cut -d= -f2-)
          ASSET=$(grep -E '^asset=' "${{ steps.marker.outputs.marker }}" | cut -d= -f2-)
          [ -n "$TAG" ]   || { echo "::error::marker 缺 tag=";   exit 1; }
          [ -n "$SRC" ]   || { echo "::error::marker 缺 src=";   exit 1; }
          [ -n "$ASSET" ] || { echo "::error::marker 缺 asset="; exit 1; }
          # 资产名必须 ASCII（runner locale 会损坏中文资产名）
          echo "$ASSET" | LC_ALL=C grep -q '[^ -~]' && \
            { echo "::error::asset 名必须为 ASCII（$ASSET）"; exit 1; }
          echo "tag=$TAG"   >> "$GITHUB_OUTPUT"
          echo "src=$SRC"   >> "$GITHUB_OUTPUT"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG  src=$SRC  asset=$ASSET"
      - name: 上传资产到 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.m.outputs.tag }}"
          SRC="${{ steps.m.outputs.src }}"
          ASSET="${{ steps.m.outputs.asset }}"
          test -f "$SRC" || { echo "::error::成片不在本分支: $SRC（须先 commit）"; exit 1; }
          # release 不存在则兜底创建（正常流程里代理已建好壳并写好 notes）
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG 不存在，兜底创建"
            gh release create "$TAG" --target "$GITHUB_REF_NAME" \
              --title "Release $TAG" --notes "由 release-upload 管道兜底创建"
          fi
          cp "$SRC" "/tmp/$ASSET"
          echo "sha256: $(sha256sum "/tmp/$ASSET" | cut -d' ' -f1)"
          gh release upload "$TAG" "/tmp/$ASSET" --clobber
          echo "---- 当前 release 资产 ----"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
            --jq '.assets[] | {name, size, state}'
