name: Visual QC - regenerate rejected scenes serially
on:
  push:
    branches: [arena/01a0f777-monalisa-film]
    paths: [RUN_VISUAL_REPAIR]
permissions:
  contents: write
  actions: read
env:
  AGNES_MAX_TRIES: '200'
concurrency:
  group: agnes-film
  cancel-in-progress: false
jobs:
  repair_01_1:
    name: Repair 01 - window 1 - max 200
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: raw-clips
          path: .
          run-id: '37011035670'
          github-token: ${{ github.token }}
      - name: Archive reviewed source and apply revised shot
        run: python3 scripts/init_visual_repair.py --scene 01
      - name: Generate candidate - never mark visual approval
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
        run: python3 -u scripts/generate.py --scene 01 --create-window 50
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-01-1
          path: |
            clips/
            work/
          retention-days: 30
          if-no-files-found: error
  repair_01_2:
    name: Repair 01 - window 2 - max 200
