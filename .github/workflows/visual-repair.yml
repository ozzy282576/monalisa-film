  review_candidates:
    needs: repair_13_4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: visual-13-4
          path: .
      - name: Install inspection tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg fonts-dejavu-core
          python3 -m pip install pillow
      - name: Machine checks - visual approval remains pending
        run: python3 scripts/review_replacements.py
      - name: New candidate evidence only
        env:
          REVIEW_IDS: '01,07,10,11,12,13'
          REVIEW_OUTPUT: review/visual-repair-v1
        run: python3 scripts/prepare_visual_review.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-repair-candidates
          path: |
            clips/
            work/
            review/visual-repair-v1/
          retention-days: 30
      - name: Publish new small evidence sheets for manual review
        run: |
          git config user.name 'arena-ai-coding-agent[bot]'
          git config user.email '298482267+arena-ai-coding-agent[bot]@users.noreply.github.com'
          git add review/visual-repair-v1
          git diff --cached --quiet && exit 0
          git commit -m 'Add replacement candidate evidence - NOT visually approved'
          git pull --rebase origin arena/01a0f777-monalisa-film
          git push origin HEAD:arena/01a0f777-monalisa-film
