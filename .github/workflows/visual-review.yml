name: Extract dense visual review evidence
on:
  push:
    branches: [arena/01a0f777-monalisa-film]
    paths: [RUN_VISUAL_REVIEW]
permissions:
  contents: write
  actions: read
concurrency:
  group: agnes-film
  cancel-in-progress: false
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0f777-monalisa-film
      - uses: actions/download-artifact@v4
        with:
          name: raw-clips
          run-id: '37011035670'
          github-token: ${{ github.token }}
          path: .
      - name: Install frame review tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg fonts-dejavu-core
          python3 -m pip install pillow
      - name: Extract 24 frames per clip and prepare sheets
        run: python3 scripts/prepare_visual_review.py
      - name: Preserve dense full-resolution frames
        uses: actions/upload-artifact@v4
        with:
          name: dense-review-frames
          path: |
            work/dense-frames/
            review/evidence/
          retention-days: 30
      - name: Publish small review sheets to the working branch
        run: |
          git config user.name 'arena-ai-coding-agent[bot]'
          git config user.email '298482267+arena-ai-coding-agent[bot]@users.noreply.github.com'
          git add review/evidence
          git diff --cached --quiet && exit 0
          git commit -m 'Add visual QC evidence sheets and original media metadata'
          git push origin HEAD:arena/01a0f777-monalisa-film
